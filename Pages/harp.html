<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrapbook Page</title>
  <link rel="stylesheet" href="../Styles/harp.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scrapbook">
    <div class="page">
      <div class="title">
        <h1>The Harp</h1>
        <img class="titlePicture" src="../Assets/Images/harp/harStickerOne.png" alt="Harp Icon" class="icon">
      </div>

      <div class="gridPage">
        <div class="gridItem">
          <img class="takenPicture" src="../Assets/Images/harp/pictureOne.png"/>
        </div>
        <div class="gridItem">
          <img class="postIt" src="../Assets/Images/harp/postIt.png"/>
        </div>
        <div class="gridItem">
          <img class="takenPicture" src="../Assets/Images/harp/pictureTwo.png"/>
        </div>
        <div class="gridItem">
          <img class="takenPicture" src="../Assets/Images/harp/pictureThree.png"/>
        </div>
      </div>
        
    </div>
    <div class="page">
      <div class="title">
        <img class="titlePicture" src="../Assets/Images/harp/harpStickerTwo.png" alt="Harp Icon" class="icon">
      </div>
      <div class="gridPage">
        <div class="gridItem">
          <img class="takenPicture" src="../Assets/Images/harp/pictureFour.png"/>
        </div>
        <div class="gridItem">
          <img class="takenPicture" src="../Assets/Images/harp/pictureOne.png"/>
        </div>
        <div class="gridItem">
          <img class="takenPicture" src="../Assets/Images/harp/pictureTwo.png"/>
        </div>
        <div class="gridItem">
          <img class="postIt" src="../Assets/Images/harp/postIt.png"/>
        </div>
      </div>

      </div>
    </div>
  </div>
</body>
</html>
