<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrapbook Page</title>
  <link rel="stylesheet" href="../Styles/harp.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scrapbook">
    <div class="page">
      <div class="title">
        <h1>The Harp</h1>
        <img class="titlePicture" src="../Assets/Images/harp/harStickerOne.png" alt="Harp Icon" class="icon">
      </div>

      <div class="image-grid">
        <div class="picture-frame">
          <img class="taken-picture" src="../Assets/Images/harp/pictureTwo.png">
        </div>
        <div class="post-it">
          <p>Lorem Ipsum is simply dummy text of the printing and typesetting industry.</p>
        </div>
        
        <div class="image-frame">
          <img class="taken-picture" src="../Assets/Images/harp/pictureOne.png">
        </div>
        
      </div>
    </div>
    <div class="page">
      <div class="image-grid">
        <div class="image-frame">
          <img class="taken-picture" src="../Assets/Images/harp/pictureThree.png">
        </div>
        <div class="image-frame">
          <img class="taken-picture" src="../Assets/Images/harp/pictureFour.png">
        </div>
        <img class="postItPicture" src="../Assets/Images/harp/postIt.png" alt="Polaroid Icon">

      </div>
    </div>
  </div>
</body>
</html>
